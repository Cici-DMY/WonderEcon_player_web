<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Scene — Browse</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
body { display: flex; justify-content: center; align-items: center; }
.scene {
  position: relative;
  width: min(95vw, calc(95vh * 1.333));
  aspect-ratio: 4 / 3;
}
.scene .bg {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.item {
  position: absolute;
  user-select: none;
}
.item img {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  filter: drop-shadow(4px 6px 6px rgba(40,30,10,0.18));
}
/* ─── 小人行走图层 ─── */
.agents-overlay {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 500;
}
.agents-overlay .agent { pointer-events: auto; cursor: pointer; }
.agent-frame { image-rendering: auto; }
.floor-poly { fill: rgba(74,144,217,.06); stroke: #4a90d9; stroke-width: 2; stroke-dasharray: 10 8; }
.route-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<!-- Return to Map button -->
<button id="btnReturnMap" style="position:fixed;top:20px;right:20px;z-index:9999;padding:10px 24px;font-size:16px;border-radius:8px;border:none;background:#2f80ed;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);">Return to Map</button>

<div class="scene" id="scene">
  <img class="bg" src="images/background.png" alt="Background">

  <!-- 双人柜台1 -->
  <div class="item" id="el-counter-double1" data-name="Double Counter 1" style="width:15%; left:42.17%; top:28.33%; z-index:20;">

  <!-- ATM机 -->

  <!-- 单人柜台 -->

  <!-- 右沙发 -->

  <!-- 左茶几 -->

  <!-- 右茶几 -->

  <!-- 银行标志 -->

    <img src="cutouts/15.png">
  </div>

  <!-- 小人行走图层 -->
  <svg class="agents-overlay" id="agents-overlay" viewBox="0 0 1000 750" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <g id="floor-debug" style="display:none"></g>
    <g id="bank-characters"></g>
  </svg>
</div>

<script>
// === 嵌入式快照 ===
const EMBEDDED_LAYOUT = {
  "el-counter-double1": { "left": "40.92%", "top": "27.01%", "width": "15%" },
  "el-counter-double2": { "left": "57.37%", "top": "37.61%", "width": "15%" },
  "el-atm": { "left": "39.72%", "top": "13.55%", "width": "6%" },
  "el-counter-single": { "left": "39.18%", "top": "47.81%", "width": "10%" },
  "el-sofa-left": { "left": "50.82%", "top": "70.52%", "width": "9.5%" },
  "el-sofa-right": { "left": "18.12%", "top": "35.46%", "width": "10%" },
  "el-table-left": { "left": "56.59%", "top": "76.42%", "width": "10%" },
  "el-table-right": { "left": "22.32%", "top": "41.28%", "width": "10%" },
  "el-barrier": { "left": "57.55%", "top": "58.33%", "width": "16%" },
  "el-sign": { "left": "30.00%", "top": "62.56%", "width": "3.5%" },
  "el-plant-lt": { "left": "8.22%", "top": "42.55%", "width": "5.5%" },
  "el-plant-rt": { "left": "30.96%", "top": "25.98%", "width": "4%" },
  "el-plant-rb": { "left": "49.86%", "top": "78.02%", "width": "5.5%" },
  "el-plant-lf": { "left": "73.87%", "top": "42.95%", "width": "5.5%" },
  "el-safe": { "left": "84.55%", "top": "43.99%", "width": "9.5%" },
  "el-rack": { "left": "25.80%", "top": "57.69%", "width": "4.5%" },
  "el-bin": { "left": "70.09%", "top": "52.04%", "width": "2%" },
  "el-logo": { "left": "63.91%", "top": "24.70%", "width": "4%" }
};
const EMBEDDED_ROUTES = [
  {
    "name": "person1",
    "x": 540.4217867826187,
    "y": 380.95974868139956,
    "fixedRoute": [
      [381, 578],
      [469, 514],
      [307, 409],
      [399, 323],
      [582, 398]
    ],
    "linear": false,
    "atEnd": false
  },
  {
    "name": "person2",
    "x": 782.8878915935962,
    "y": 434.6392483154178,
    "fixedRoute": [
      [718, 485],
      [771, 520],
      [840, 485],
      [785, 433]
    ],
    "linear": false,
    "atEnd": false
  }
];

// === Load positions from embedded layout ===
function loadPositions() {
  if (EMBEDDED_LAYOUT && typeof EMBEDDED_LAYOUT === 'object') {
    const data = EMBEDDED_LAYOUT;
    Object.keys(data).forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.style.left = data[id].left;
        el.style.top = data[id].top;
        if (data[id].width) el.style.width = data[id].width;
      }
    });
  }

  // Route restore
  if (Array.isArray(EMBEDDED_ROUTES)) {
    const routeData = EMBEDDED_ROUTES;
    function restoreRoutes(agents) {
      routeData.forEach(r => {
        const ag = agents.find(a => a.name === r.name);
        if (!ag || !r.fixedRoute) return;
        ag.x               = r.x;
        ag.y               = r.y;
        ag.fixedRoute      = r.fixedRoute.map(p => [...p]);
        ag.linear          = false; // always loop in browse mode
        ag.atEnd           = false;
        ag.fixedRouteIndex = 0;
        ag.target          = null;
        ag.pauseUntil      = 0;
      });
    }
    if (window.__bankAgents) {
      restoreRoutes(window.__bankAgents);
    } else {
      document.addEventListener('bank:agentsReady', e => restoreRoutes(e.detail.agents), { once: true });
    }
  }
}

loadPositions();

// === Return to Map button ===
document.getElementById('btnReturnMap').addEventListener('click', function() {
  window.location.href = window.location.origin + '/main_map.html';
});
</script>

<!-- ════════ 小人行走系统（Browse Mode：仅NPC循环巡逻）════════ -->
<script>
(() => {
  const svgNS = "http://www.w3.org/2000/svg";
  const charactersLayer = document.querySelector("#bank-characters");
  const scene = document.getElementById("scene");

  const WALK_CONFIG = {
    floorPolygon: [[470, 158], [924, 428], [524, 698], [52, 353]],
    frameMs: 60,
    pauseMs: [400, 1200]
  };

  // ─── 精灵定义 ───
  const WALK_1_SPRITE = {
    box: 135, footFrac: 0.826, midFrac: 0.499,
    dirs: {
      front: Array.from({ length: 12 }, (_, i) => `../../person/walk_1/walk_front_${String(i+1).padStart(2,"0")}.png`),
      back:  Array.from({ length: 12 }, (_, i) => `../../person/walk_1/walk_back_${String(i+1).padStart(2,"0")}.png`),
      left:  Array.from({ length: 12 }, (_, i) => `../../person/walk_1/walk_left_${String(i+1).padStart(2,"0")}.png`),
      right: Array.from({ length: 12 }, (_, i) => `../../person/walk_1/walk_right_${String(i+1).padStart(2,"0")}.png`)
    },
    dirMap: { front: "front", back: "back", left: "left", right: "right" }
  };
  WALK_1_SPRITE.idle = WALK_1_SPRITE.dirs.front[0];

  const WALK_2_SPRITE = {
    box: 135, footFrac: 0.826, midFrac: 0.499,
    dirs: {
      front: Array.from({ length: 12 }, (_, i) => `../../person/walk_2/walk_front_${String(i+1).padStart(2,"0")}.png`),
      back:  Array.from({ length: 12 }, (_, i) => `../../person/walk_2/walk_back_${String(i+1).padStart(2,"0")}.png`),
      left:  Array.from({ length: 12 }, (_, i) => `../../person/walk_2/walk_left_${String(i+1).padStart(2,"0")}.png`),
      right: Array.from({ length: 12 }, (_, i) => `../../person/walk_2/walk_right_${String(i+1).padStart(2,"0")}.png`)
    },
    dirMap: { front: "front", back: "back", left: "left", right: "right" }
  };
  WALK_2_SPRITE.idle = WALK_2_SPRITE.dirs.front[0];

  const SPRITE_POOL = [WALK_1_SPRITE, WALK_2_SPRITE];

  function _makeBankSprite(folder) {
    const dirs = {
      front: Array.from({ length: 12 }, (_, i) => `${folder}/walk_front_${String(i+1).padStart(2,"0")}.png`),
      back:  Array.from({ length: 12 }, (_, i) => `${folder}/walk_back_${String(i+1).padStart(2,"0")}.png`),
      left:  Array.from({ length: 12 }, (_, i) => `${folder}/walk_left_${String(i+1).padStart(2,"0")}.png`),
      right: Array.from({ length: 12 }, (_, i) => `${folder}/walk_right_${String(i+1).padStart(2,"0")}.png`)
    };
    return { box: 135, footFrac: 0.826, midFrac: 0.499, dirs, dirMap: { front: "front", back: "back", left: "left", right: "right" }, idle: dirs.front[0] };
  }

  // ─── SVG helper ───
  function svgElement(tag, attrs = {}) {
    const el = document.createElementNS(svgNS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  // ─── 创建角色 ───
  function buildAgent({ name, label, sprite, x, y, speed = 45, scale = 1 }) {
    const root = svgElement("g", { class: "agent", "data-agent": name, "data-label": label });
    const depth = svgElement("g", { class: "agent-depth" });
    const sp = sprite;
    const image = svgElement("image", {
      class: "agent-frame",
      href: sp.idle,
      x: -sp.box * sp.midFrac,
      y: -sp.box * sp.footFrac,
      width: sp.box,
      height: sp.box,
      preserveAspectRatio: "xMidYMid meet"
    });

    depth.appendChild(image);
    root.appendChild(depth);
    charactersLayer.appendChild(root);

    return {
      el: root, name, label, x, y, speed, scale, sprite: sp,
      dir: "front", frameIndex: 0, frameClock: 0,
      target: null, fixedRoute: null, fixedRouteIndex: 0,
      linear: false,
      atEnd: false,
      pauseUntil: performance.now() + Math.random() * 500,
      image, depthNode: depth
    };
  }

  // ─── 创建两个 NPC 巡逻角色 ───
  const agents = [
    buildAgent({ name: "person1", label: "Banker A", sprite: SPRITE_POOL[0], x: 0, y: 0, speed: 42 }),
    buildAgent({ name: "person2", label: "Banker B", sprite: SPRITE_POOL[1], x: 0, y: 0, speed: 48, scale: 0.889 })
  ];

  // ─── 固定分配路线（循环） ───
  const WALK_ZONES = [
    { route: [[381, 578],[469, 514],[307, 409],[399, 323],[582, 398]] },
    { route: [[718, 485],[771, 520],[840, 485],[785, 433]] }
  ];
  agents.forEach((agent, i) => {
    const zone = WALK_ZONES[i];
    agent.fixedRoute = zone.route;
    agent.fixedRouteIndex = 0;
    agent.linear = false; // loop
    agent.atEnd = false;
    agent.x = zone.route[0][0];
    agent.y = zone.route[0][1];
  });

  // ─── 帧动画与方向 ───
  const FRAME_MS = 60;
  const PAUSE_MS = [400, 1200];

  function pauseDuration() {
    return PAUSE_MS[0] + Math.random() * (PAUSE_MS[1] - PAUSE_MS[0]);
  }

  function getDirection(dx, dy) {
    const u = dx - dy;
    const v = dx + dy;
    if (Math.abs(u) >= Math.abs(v)) {
      return u >= 0 ? "front" : "back";
    }
    return v >= 0 ? "right" : "left";
  }

  function setFrame(agent, walking, dtMs) {
    const sp = agent.sprite;
    let mappedDir = agent.dir;
    let mirror = false;
    if (sp.dirMap && sp.dirMap[agent.dir] != null) {
      const m = sp.dirMap[agent.dir];
      if (typeof m === "string") {
        mappedDir = m;
      } else if (typeof m === "object") {
        mappedDir = m.dir || agent.dir;
        mirror = !!m.mirror;
      }
    }
    const frames = sp.dirs[mappedDir] || sp.dirs.front;

    if (mirror) {
      agent.image.setAttribute("transform", "translate(0,0) scale(-1,1)");
    } else {
      agent.image.removeAttribute("transform");
    }

    if (!walking) {
      agent.frameIndex = 0;
      agent.frameClock = 0;
      const f = frames[0];
      if (agent.currentHref !== f) {
        agent.currentHref = f;
        agent.image.setAttribute("href", f);
      }
      return;
    }
    agent.frameClock += dtMs;
    if (agent.frameClock >= FRAME_MS) {
      const steps = Math.floor(agent.frameClock / FRAME_MS);
      agent.frameClock %= FRAME_MS;
      agent.frameIndex = (agent.frameIndex + steps) % frames.length;
    }
    const f = frames[agent.frameIndex];
    if (agent.currentHref !== f) {
      agent.currentHref = f;
      agent.image.setAttribute("href", f);
    }
  }

  // ─── 下一个目标点（循环） ───
  function nextTarget(agent) {
    // Always loop: wrap index around
    agent.fixedRouteIndex = (agent.fixedRouteIndex + 1) % agent.fixedRoute.length;
    const [x, y] = agent.fixedRoute[agent.fixedRouteIndex];
    return { x, y };
  }

  // ─── 主循环 ───
  let previousTime = performance.now();

  function tick(now) {
    const dtMs = Math.min(now - previousTime, 50);
    const dt = dtMs / 1000;
    previousTime = now;

    for (const agent of agents) {
      let walking = false;

      if (!agent.target && now >= agent.pauseUntil) {
        const next = nextTarget(agent);
        if (next) agent.target = next;
      }

      if (agent.target) {
        const dx = agent.target.x - agent.x;
        const dy = agent.target.y - agent.y;
        const distance = Math.hypot(dx, dy);

        if (distance < 2) {
          agent.x = agent.target.x;
          agent.y = agent.target.y;
          agent.target = null;
          agent.pauseUntil = now + pauseDuration();
        } else {
          walking = true;
          const step = Math.min(distance, agent.speed * dt);
          agent.x += (dx / distance) * step;
          agent.y += (dy / distance) * step;
          agent.dir = getDirection(dx, dy);
        }
      }

      setFrame(agent, walking, dtMs);
      agent.el.setAttribute("transform", `translate(${agent.x.toFixed(2)} ${agent.y.toFixed(2)})`);
      agent.depthNode.setAttribute("transform", `scale(${agent.scale})`);
    }

    // y-sort for depth ordering
    const sorted = agents.slice().sort((a, b) => a.y - b.y);
    const orderKey = sorted.map(a => a.name).join("|");
    if (orderKey !== lastAgentOrderKey) {
      lastAgentOrderKey = orderKey;
      sorted.forEach(a => charactersLayer.appendChild(a.el));
    }
    requestAnimationFrame(tick);
  }
  let lastAgentOrderKey = "";

  // Preload sprite images then start
  function preloadSpriteImages() {
    const urls = new Set();
    SPRITE_POOL.forEach(sp => {
      if (sp.idle) urls.add(sp.idle);
      Object.values(sp.dirs || {}).forEach(arr => arr.forEach(u => urls.add(u)));
    });
    return Promise.all([...urls].map(src => new Promise(res => {
      const img = new Image();
      img.onload = res; img.onerror = res; img.src = src;
    })));
  }
  preloadSpriteImages().then(() => {
    requestAnimationFrame(tick);
  });

  // Expose agents for route restoration
  window.__bankAgents = agents;
  document.dispatchEvent(new CustomEvent("bank:agentsReady", { detail: { agents } }));
})();
</script>
</body>
</html>
